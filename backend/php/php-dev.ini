; =============================================================================
; TapFolio — PHP config (desenvolvimento)
; =============================================================================

; Erros — exibir tudo em dev
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On

; Limites
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 10M
post_max_size = 10M

; Timezone
date.timezone = America/Sao_Paulo

; OPcache desabilitado em dev para refletir mudanças sem restart
opcache.enable = 0

; Extensions
extension = pdo_pgsql
extension = redis
